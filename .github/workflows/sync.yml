name: weekly-upstream-sync

# Moves every upstream pin to its latest commit and opens a pull request.
# It NEVER merges. A skill is an instruction that runs with the user's permissions,
# so a person must read the diff before anything reaches users.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest

      - name: Move the pins and re-copy
        run: python -I scripts/sync.py --update

      - name: Validate and test the result
        run: |
          python -I scripts/validate.py
          python -m pytest -q

      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No upstream changes."
            exit 0
          fi
          branch="sync/upstream"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore: sync upstream skills"
          git push --force origin "$branch"
          {
            echo "Automated upstream sync. **Read the diff before merging.**"
            echo
            echo "Checklist:"
            echo "- [ ] New or changed scripts reviewed (anything that downloads or runs code)"
            echo "- [ ] Changes to SKILL.md instructions read"
            echo "- [ ] Licence files unchanged in terms"
            echo "- [ ] VERSION was raised, so users receive the update"
            echo
            echo "Validation and tests passed in this run."
            echo
            echo '```'
            git diff --stat HEAD~1 | tail -n 40
            echo '```'
          } > pr-body.md
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$branch" --title "chore: sync upstream skills" --body-file pr-body.md
          else
            echo "An update pull request is already open; it was refreshed by the push."
          fi
